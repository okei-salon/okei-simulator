name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start hosting emulator
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5050/ >/dev/null; then
              echo "emulator ready"
              exit 0
            fi
            sleep 2
          done
          echo "emulator failed to start"
          exit 1
      - name: Release verify gate
        run: npm run verify:release

  # Deploy only from main (push or workflow_dispatch on main).
  # GCP WIF attribute conditions should also restrict repository + refs/heads/main.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: oukei-hub
      GCLOUD_PROJECT: oukei-hub
      FIREBASE_PROJECT: oukei-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (WIF / OIDC)
        uses: google-github-actions/auth@v2
        with:
          project_id: oukei-hub
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Prune old Hosting releases
        run: npm run hosting:cleanup
      - name: Deploy Firebase Hosting
        run: npx firebase deploy --only hosting --project oukei-hub --non-interactive
